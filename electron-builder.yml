# Packaging (electron-builder). `npm run dist` builds the app, then a Windows installer in release/;
# `npm run dist:linux` the Linux packages (see the linux block at the end).
# Must match app.setAppUserModelId in src/main/index.ts (taskbar, notifications, Start menu).
appId: dev.desktopbuddy.app
productName: DesktopBuddy
copyright: DesktopBuddy contributors (MIT)
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# koffi loads a native .node file, which can't be read from inside the asar archive.
asarUnpack:
  - node_modules/koffi/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
# One click, per-user: no questions, no admin prompt (works on school/work PCs that allow
# per-user apps), Start menu + desktop shortcuts, and the duck starts when it's done.
# Unsigned for now (Phase 8 decision), so Windows SmartScreen asks once: More info -> Run anyway.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DesktopBuddy
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Uninstalling keeps your points and items unless you erase them in Settings first.
  deleteAppDataOnUninstall: false
artifactName: DesktopBuddy-Setup-${version}.${ext}
# Where "Check for updates" looks (electron-updater reads latest.yml from the newest GitHub
# release). Only used when the user checks or turns on the daily check: no network otherwise.
# `npm run dist` never uploads anything (no --publish): releases are made by hand with gh.
publish:
  provider: github
  owner: Double-bited-Hamburger
  repo: DesktopBuddy
# Linux (Fedora, Ubuntu and the rest): `npm run dist:linux`, on Linux (CI: .github/workflows/
# linux.yml). The AppImage is one file that runs anywhere; .deb for Ubuntu/Debian, .rpm for
# Fedora. Both packages add a menu entry with the duck icon. Saves live in ~/.config/desktop-buddy
# and are never removed on uninstall.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  icon: build/icon.png
  category: Utility
  executableName: desktopbuddy
  synopsis: A pixel duck that lives on your desktop
  maintainer: DesktopBuddy contributors <249748203+Double-bited-Hamburger@users.noreply.github.com>
appImage:
  artifactName: DesktopBuddy-${version}.${ext}
deb:
  packageName: desktopbuddy # so it is `sudo apt remove desktopbuddy`
  artifactName: desktopbuddy_${version}_amd64.${ext}
rpm:
  packageName: desktopbuddy # so it is `sudo dnf remove desktopbuddy`
  artifactName: desktopbuddy-${version}.x86_64.${ext}
