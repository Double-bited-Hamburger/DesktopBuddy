# The DesktopBuddy Friends relay (see relay/README.md and docs/FRIENDS.md).
name = "desktopbuddy-relay"
main = "worker.ts"
compatibility_date = "2026-11-01"
# No usage statistics from the deploy tool either.
send_metrics = false

# Free plan: Durable Objects backed by SQLite.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = false
